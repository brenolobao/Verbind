const durSec=d=>{const m=/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(d||"")||[];return(+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0)};
const dur=d=>{const t=durSec(d),h=Math.floor(t/3600),m=Math.floor(t%3600/60),sc=t%60,p=v=>String(v).padStart(2,"0");return(h?h+":"+p(m):m)+":"+p(sc)};
const meta=n=>n.src==="yt"?`${fm(n.v)} visualizações · ${fm(n.yt.likes)} curtidas · ${fm(n.yt.com)} comentários · `:`${n.v.toLocaleString("pt-BR")} acessos em 14 dias · `;
const tipS=(n,r,i)=>n.src==="yt"?`${esc(n.yt.ch)} · ${fm(n.v)} visualizações · ${adj[i].length} conexões`:`${n.v.toLocaleString("pt-BR")} acessos · ${r?(r>2.5?"em alta":r.toFixed(1)+"× o ritmo habitual"):"—"} · ${adj[i].length} conexões`;

async function yt(path,p){const u=new URL("https://www.googleapis.com/youtube/v3/"+path);for(const[k,v]of Object.entries({key:YT_KEY,...p}))u.searchParams.set(k,v);const r=await fetch(u),j=await r.json();if(!r.ok)throw Error((j.error&&j.error.message)||"HTTP "+r.status);return j}
function ytEdges(YN){const set=new Set(),out=[],add=(a,b)=>{if(a===b)return;const k=a.t<b.t?a.t+"\n"+b.t:b.t+"\n"+a.t;if(!set.has(k)){set.add(k);out.push([a.t,b.t])}};
 const by=f=>{const m={};YN.forEach(n=>{const k=f(n);if(k)(m[k]=m[k]||[]).push(n)});return Object.values(m)};
 by(n=>n.yt.chId).forEach(gr=>gr.slice(1).forEach(n=>add(gr[0],n)));
 by(n=>n.yt.catId).forEach(gr=>{const h=gr.reduce((a,b)=>b.v>a.v?b:a);gr.forEach(n=>add(h,n))});
 const tg={},cnt={};YN.forEach(n=>new Set(n.yt.tags.map(t=>t.toLowerCase())).forEach(t=>(tg[t]=tg[t]||[]).push(n)));
 Object.values(tg).filter(a=>a.length>=2&&a.length<=8).forEach(a=>{for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){const k=a[i].t+"\n"+a[j].t;(cnt[k]=cnt[k]||[a[i],a[j],0])[2]++}});
 Object.values(cnt).filter(c=>c[2]>=2).forEach(c=>add(c[0],c[1]));return out}
async function fetchYT(term){const lg=$("lang").value,key=(term||"~")+"|"+lg;if(YC[key])return YC[key];let items=[];const FLD="snippet,statistics,contentDetails,topicDetails";
 if(term){const q=await yt("search",{part:"snippet",q:term,type:"video",maxResults:50,regionCode:YT_REGION,relevanceLanguage:lg,safeSearch:"moderate"}),ids=(q.items||[]).map(x=>x.id&&x.id.videoId).filter(Boolean);if(!ids.length)throw Error("nenhum vídeo para “"+term+"”");
  items=(await yt("videos",{part:FLD,id:ids.join(","),maxResults:50})).items||[];const ord=new Map(ids.map((d,i)=>[d,i]));items.sort((a,b)=>ord.get(a.id)-ord.get(b.id))}
 else{let tok="";for(let i=0;i<2;i++){const j=await yt("videos",{part:FLD,chart:"mostPopular",regionCode:YT_REGION,maxResults:50,...(tok?{pageToken:tok}:{})});items=items.concat(j.items||[]);tok=j.nextPageToken;if(!tok)break}}
 if(!items.length)throw Error("nenhum vídeo retornado");
 const CAT={},CH={};try{(await yt("videoCategories",{part:"snippet",regionCode:YT_REGION,hl:"pt_BR"})).items.forEach(c=>CAT[c.id]=c.snippet.title)}catch(e){}
 try{const ids=[...new Set(items.map(v=>v.snippet.channelId))];for(let i=0;i<ids.length;i+=50){const c=await yt("channels",{part:"statistics",id:ids.slice(i,i+50).join(",")});(c.items||[]).forEach(x=>{CH[x.id]=x.statistics.hiddenSubscriberCount?0:+x.statistics.subscriberCount||0})}}catch(e){}
 const seen=new Set(),nodes=items.map((v,i)=>{const sn=v.snippet,s2=v.statistics||{},th=sn.thumbnails||{};let t=sn.title;if(seen.has(t))t+=" · "+sn.channelTitle;seen.add(t);
  return{src:"yt",id:v.id,t,v:+s2.viewCount||0,x:YO.x+(Math.random()-.5)*200,y:YO.y+(Math.random()-.5)*200,vx:0,vy:0,ox:YO.x,oy:YO.y,iu:(th.default||th.medium||{}).url,
   yt:{q:term||"",ch:sn.channelTitle,chId:sn.channelId,pub:sn.publishedAt,desc:sn.description,tags:sn.tags||[],catId:sn.categoryId,cat:CAT[sn.categoryId]||"Categoria "+sn.categoryId,likes:+s2.likeCount||0,com:+s2.commentCount||0,dur:v.contentDetails&&v.contentDetails.duration,def:v.contentDetails&&v.contentDetails.definition,cap:v.contentDetails&&v.contentDetails.caption,lang:sn.defaultAudioLanguage||sn.defaultLanguage||"",topics:((v.topicDetails&&v.topicDetails.topicCategories)||[]).map(u=>{try{return decodeURIComponent(u.split("/wiki/")[1]||"").replace(/_/g," ")}catch(e){return""}}).filter(Boolean),subs:CH[sn.channelId]||0,rank:i+1,big:(th.medium||th.default||{}).url}}});
 return YC[key]={nodes,edges:ytEdges(nodes)}}
async function ytFor(term){try{const r=await fetchYT(term);YN=r.nodes;YN.forEach(n=>{n.b=undefined});YE=r.edges;YQ=term||"";SRC.yt=true;syncTg();return""}catch(e){SRC.yt=false;syncTg();return" · YouTube indisponível: "+e.message}}

function ytInfo(n){const y=n.yt,d=[["Canal",y.ch+(y.subs?" · "+fm(y.subs)+" inscritos":"")],["Publicado",new Date(y.pub).toLocaleDateString("pt-BR")+" (há "+Math.max(0,Math.round((Date.now()-new Date(y.pub))/864e5))+" dias)"],["Duração",dur(y.dur)],["Categoria",y.cat],[y.q?"Posição na busca":"Posição em alta","#"+y.rank+(y.q?"":" ("+YT_REGION+")")],["Qualidade",(y.def||"—").toUpperCase()],["Legendas",y.cap==="true"?"sim":"não"],["Idioma",y.lang||"—"]];
 return`<h4>II · Ficha do vídeo</h4>`+d.map(r=>`<div class=rz><span class=ic></span><span><b>${r[0]}:</b> ${esc(r[1])}</span></div>`).join("")+(y.tags.length?`<h4>Tags</h4><p class=sum>${y.tags.slice(0,20).map(esc).join(" · ")}</p>`:"")+(y.topics.length?`<h4>Temas da Wikipedia ligados ao vídeo</h4><p class=sum>${y.topics.map(esc).join(" · ")}</p>`:"")}
function insightsYT(i){const n=N[i],y=n.yt,o=[],d=adj[i].length,days=Math.max(1,(Date.now()-new Date(y.pub))/864e5),sm=YN.filter(v=>v.yt.chId===y.chId&&v!==n),sc=durSec(y.dur);
 o.push(y.q?`Ocupa a ${y.rank}ª posição na busca por “${y.q}” no YouTube, com ${fm(n.v)} visualizações.`:`Ocupa a ${y.rank}ª posição entre os vídeos em alta no YouTube (${YT_REGION}), com ${fm(n.v)} visualizações.`);
 if(n.v)o.push(`Engajamento: ${(y.likes/n.v*100).toFixed(1).replace(".",",")} curtidas por 100 visualizações e ${(y.com/n.v*1000).toFixed(1).replace(".",",")} comentários por 1.000.`);
 o.push(`Publicado há ${Math.round(days)} dia(s): média de ${fm(Math.round(n.v/days))} visualizações por dia.`);
 if(sm.length)o.push(`O canal ${y.ch} tem mais ${sm.length} vídeo(s) ${y.q?"nesta busca":"em alta agora"}.`);
 o.push(sc<=60?"É um vídeo curto (até 1 minuto).":sc>=1800?"É um vídeo longo (mais de 30 minutos).":"Duração: "+dur(y.dur)+".");
 o.push(`Conecta-se a ${d} vídeo(s) por canal, categoria (${y.cat}) ou tags em comum.`);
 if(y.topics.length)o.push(`O YouTube associa o vídeo a temas da Wikipedia: ${y.topics.slice(0,4).join(", ")}.`);return o}
function reasonsYT(a,b){const A=a.yt,B=b.yt,R=[];let sc=0;
 if(A.chId===B.chId){R.push(["▶","Mesmo canal:",A.ch]);sc+=2}
 if(A.catId===B.catId){R.push(["#","Mesma categoria:",A.cat]);sc+=1}
 const ta=new Set(A.tags.map(t=>t.toLowerCase())),sh=B.tags.filter(t=>ta.has(t.toLowerCase()));if(sh.length){R.push(["∴","Tags em comum:",sh.slice(0,5).join(" · ")]);sc+=Math.min(2,sh.length/2)}
 const tp=A.topics.filter(t=>B.topics.includes(t));if(tp.length){R.push(["W","Temas da Wikipedia em comum:",tp.join(" · ")]);sc+=1}
 return{R,s:Math.max(1,Math.min(5,Math.round(sc+1)))}}

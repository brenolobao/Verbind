<style>

.sum{color:var(--mut);line-height:1.6;margin-top:10px}#panel.full .sum{font-size:17px}.lnk{color:var(--fg);font:700 14px "Bricolage Grotesque",sans-serif;text-underline-offset:4px;display:inline-block;margin-top:8px}.b{margin:16px 0}

#gate{position:fixed;inset:0;z-index:50;color:#fff}#gate[hidden]{display:none}

<script>
const $=id=>document.getElementById(id),cv=$("c"),g=cv.getContext("2d"),st=t=>{$("st").textContent=t;$("gs").textContent=t};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let W,H,dpr,N=[],E=[],idx=new Map(),adj=[],cam={x:0,y:0,k:1},sel=-1,hov=-1,alpha=1,tween=null,CL=[],busy=false,full=false;
const TR={},SR={},D=new Set(),ENR={},SUM={},PI={};let LOAD=0;
const ST=Array.from({length:130},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.3+.3,p:Math.random()*.6+.2}));
function rs(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}rs();addEventListener("resize",rs);
async function api(p){const u=new URL(`https://${$("lang").value}.wikipedia.org/w/api.php`);for(const[k,v]of Object.entries({format:"json",origin:"*",...p}))u.searchParams.set(k,v);const r=await fetch(u);if(!r.ok)throw Error("HTTP "+r.status);return r.json()}
async function outLinks(t){let out=[],c={};do{const j=await api({action:"query",prop:"links",titles:t,plnamespace:0,pllimit:"max",...c});const p=Object.values(j.query.pages)[0];(p.links||[]).forEach(l=>out.push(l.title));c=j.continue||null}while(c&&out.length<1500);return out}
async function views(ts){const m={},ch=[];for(let i=0;i<ts.length;i+=50)ch.push(ts.slice(i,i+50));
 await Promise.all(ch.map(async c=>{const j=await api({action:"query",prop:"pageviews",pvipdays:14,titles:c.join("|")});Object.values(j.query.pages).forEach(p=>{const a=Object.entries(p.pageviews||{}).filter(e=>e[1]!=null).sort().map(e=>e[1]);m[p.title]=a.reduce((x,y)=>x+y,0);SR[p.title]=a;if(a.length>=6){const l=(a[a.length-1]+a[a.length-2])/2,r=a.slice(0,-2).reduce((x,y)=>x+y,0)/(a.length-2);TR[p.title]=(l+1)/(r+1)}})}));return m}
async function edges(ts){const ch=[];for(let i=0;i<ts.length;i+=50)ch.push(ts.slice(i,i+50));const set=new Set(),out=[],jobs=[];
 ch.forEach(s=>ch.forEach(t=>jobs.push((async()=>{let c={};do{const j=await api({action:"query",prop:"links",titles:s.join("|"),pltitles:t.join("|"),plnamespace:0,pllimit:"max",...c});Object.values(j.query.pages).forEach(p=>(p.links||[]).forEach(l=>{const a=p.title,b=l.title;if(a===b)return;D.add(a+"\n"+b);const k=a<b?a+"\n"+b:b+"\n"+a;if(!set.has(k)){set.add(k);out.push([a,b])}}));c=j.continue||null}while(c)})())));
 await Promise.all(jobs);return out}
const okT=t=>!/^(Lista|List|Anexo|Categor)/i.test(t);
function setGraph(titles,vw,sp){const old=new Map(N.map(n=>[n.t,n]));N=titles.map(t=>old.get(t)||{t,v:0,x:(sp?sp.x:0)+(Math.random()-.5)*60,y:(sp?sp.y:0)+(Math.random()-.5)*60,vx:0,vy:0});N.forEach(n=>{if(vw[n.t]!=null)n.v=vw[n.t]});idx=new Map(N.map((n,i)=>[n.t,i]))}
function finish(pairs){E=pairs.filter(([a,b])=>idx.has(a)&&idx.has(b)).map(([a,b])=>[idx.get(a),idx.get(b)]);adj=N.map(()=>[]);E.forEach(([a,b])=>{adj[a].push(b);adj[b].push(a)});
 const mx=Math.log(1+Math.max(...N.map(n=>n.v),1));N.forEach(n=>{n.vn=Math.log(1+n.v)/mx;n.hot=(TR[n.t]||0)>2.5});cluster();alpha=1;const had=reveal();if(!had)for(let z=0;z<260;z++)sim();shelf();loadThumbs()}
let GD=false,LB=0;
function reveal(){const seq=[],vis=new Set(),q=[];N.forEach((n,i)=>{if(n.b!==undefined){vis.add(i);q.push(i)}});const had=q.length>0,rest=[...N.keys()].filter(i=>!vis.has(i)).sort((a,b)=>N[b].v-N[a].v);
 if(!had&&rest.length){vis.add(rest[0]);seq.push(rest[0]);q.push(rest[0])}
 let h=0;while(true){if(h>=q.length){const nx=rest.find(i=>!vis.has(i));if(nx===undefined)break;vis.add(nx);seq.push(nx);q.push(nx)}else{adj[q[h]].slice().sort((a,b)=>N[b].v-N[a].v).forEach(j=>{if(!vis.has(j)){vis.add(j);seq.push(j);q.push(j)}});h++}}
 const base=performance.now()+(had?80:GD?100:1700),step=Math.min(70,Math.max(16,3600/Math.max(1,seq.length)));seq.forEach((i,o)=>{N[i].b=base+o*step});LB=Math.max(LB,base+seq.length*step);return had}
async function loadThumbs(){const ts=N.map(n=>n.t).filter(t=>PI[t]===undefined);for(let i=0;i<ts.length;i+=50){const c=ts.slice(i,i+50);try{const j=await api({action:"query",prop:"pageimages",piprop:"thumbnail",pithumbsize:40,pilimit:"max",titles:c.join("|")});c.forEach(t=>PI[t]="");Object.values(j.query.pages).forEach(p=>{PI[p.title]=p.thumbnail?p.thumbnail.source:""})}catch(e){}}}
function ensureImg(n){if(n.st||!PI[n.t]||LOAD>=6)return;n.st=1;LOAD++;const im=new Image();im.onload=()=>{const z=40,c=document.createElement("canvas");c.width=c.height=z;const x=c.getContext("2d");x.beginPath();x.arc(z/2,z/2,z/2,0,7);x.clip();const sc=Math.max(z/im.width,z/im.height);x.drawImage(im,(z-im.width*sc)/2,(z-im.height*sc)/2,im.width*sc,im.height*sc);n.ic=c;n.st=2;LOAD--};im.onerror=()=>{n.st=3;LOAD--};im.src=PI[n.t]}
function cluster(){const lab=N.map((_,i)=>i);for(let it=0;it<15;it++){[...N.keys()].sort(()=>Math.random()-.5).forEach(i=>{const c={};adj[i].forEach(j=>c[lab[j]]=(c[lab[j]]||0)+1);let b=lab[i],bc=0;for(const k in c)if(c[k]>bc){bc=c[k];b=+k}lab[i]=b})}
 const gr={};lab.forEach((l,i)=>(gr[l]=gr[l]||[]).push(i));CL=Object.values(gr).filter(a=>a.length>=3).sort((a,b)=>b.length-a.length).map((m,ci)=>({m,ci,h:ci*47%360,name:N[m.reduce((a,b)=>N[b].v>N[a].v?b:a)].t}));
 N.forEach(n=>{n.col="#000";n.cl=-1});CL.forEach(c=>c.m.forEach(j=>{N[j].cl=c.ci}))}
function cen(c){let X=0,Y=0;c.m.forEach(j=>{X+=N[j].x;Y+=N[j].y});X/=c.m.length;Y/=c.m.length;let d=0;c.m.forEach(j=>d+=Math.hypot(N[j].x-X,N[j].y-Y));return{X,Y,r:Math.max(70,d/c.m.length*1.7)}}
function shelf(){$("shelf").innerHTML="";CL.slice(0,9).forEach(c=>{const b=document.createElement("button");b.textContent=`${c.name} · ${c.m.length}`;b.onclick=()=>{const p=cen(c);fly(p.X,p.Y,1.2)};$("shelf").appendChild(b)})}
function sim(){if(alpha<.01)return;for(let i=0;i<N.length;i++){const a=N[i];for(let j=i+1;j<N.length;j++){const b=N[j];let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+.5;if(d2>160000)continue;const f=2600/d2;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f}}
 E.forEach(([i,j])=>{const a=N[i],b=N[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-80)*.01;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f});
 N.forEach(n=>{const gv=.0015+.03*n.vn**3;n.vx-=n.x*gv;n.vy-=n.y*gv;n.x+=n.vx*alpha;n.y+=n.vy*alpha;n.vx*=.8;n.vy*=.8});alpha*=.985}
const sx=x=>(x-cam.x)*cam.k+W/2,sy=y=>(y-cam.y)*cam.k+H/2,wx=x=>(x-W/2)/cam.k+cam.x,wy=y=>(y-H/2)/cam.k+cam.y,rad=n=>2.5+n.vn*8;
function draw(){sim();const k=cam.k,tm=performance.now(),rg=Math.max(0,Math.min(1,(tm-(LB-500))/1000)),nb=sel>=0&&N[sel]?new Set([sel,...adj[sel]]):null;g.lineJoin="round";
 g.fillStyle="#f2f2f2";g.fillRect(0,0,W,H);
 const gs=64*k;if(gs>22){g.strokeStyle="rgba(0,0,0,.045)";g.lineWidth=1;g.beginPath();for(let y=((H/2-cam.y*k)%gs+gs)%gs;y<H;y+=gs){g.moveTo(0,y);g.lineTo(W,y)}g.stroke()}
 g.setLineDash([2,7]);g.strokeStyle="rgba(0,0,0,.22)";g.lineWidth=1;[150,300,450].forEach(r=>{g.beginPath();g.arc(sx(0),sy(0),r*k,0,7);g.stroke()});g.setLineDash([]);
 g.font='500 10px "DM Mono",monospace';g.fillStyle="#4d4d4d";g.textAlign="center";g.fillText("CENTRO · EM ALTA",sx(0),sy(0)-150*k-7);g.fillText("BORDAS · O QUE NINGUÉM COMENTA",sx(0),sy(0)-450*k-7);
 CL.forEach(c=>{const p=cen(c),r=p.r*k,gr=g.createRadialGradient(sx(p.X),sy(p.Y),0,sx(p.X),sy(p.Y),r);gr.addColorStop(0,`rgba(0,0,0,${(nb?.02:.07)*rg})`);gr.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=gr;g.beginPath();g.arc(sx(p.X),sy(p.Y),r,0,7);g.fill()});
 E.forEach(([i,j],e)=>{let a=N[i],b=N[j];if(a.b>b.b){const u=a;a=b;b=u}const p=Math.min(1,(tm-(b.b-400))/450);if(p<=0)return;const q=1-(1-p)**2,on=nb&&(i===sel||j===sel);g.strokeStyle=on?"#000":nb?"rgba(0,0,0,.04)":"rgba(0,0,0,.17)";g.lineWidth=on?2:1;g.beginPath();g.moveTo(sx(a.x),sy(a.y));g.lineTo(sx(a.x+(b.x-a.x)*q),sy(a.y+(b.y-a.y)*q));g.stroke();
  if(on&&p>=1){const f=(tm/1700+e*.17)%1,A=N[i===sel?i:j],B=N[i===sel?j:i],px=sx(A.x+(B.x-A.x)*f),py=sy(A.y+(B.y-A.y)*f);g.fillStyle="#fff";g.strokeStyle="#000";g.lineWidth=1.5;g.beginPath();g.arc(px,py,3,0,7);g.fill();g.stroke()}});
 const ca=Math.max(0,Math.min(1,(1.5-k)/.7));
 if(ca>0)CL.forEach(c=>{const p=cen(c);g.globalAlpha=ca*rg*(nb?.25:1);g.fillStyle="#000";g.font='800 '+(15+c.m.length/2.5)+'px "Bricolage Grotesque",sans-serif';g.textAlign="center";g.fillText(c.name,sx(p.X),sy(p.Y));g.globalAlpha=1});
 const rank=[...N.keys()].sort((a,b)=>N[b].v-N[a].v),top=new Set(rank.slice(0,Math.round(8+k*10)));
 N.forEach((n,i)=>{const x=sx(n.x),y=sy(n.y);let r=rad(n)*Math.min(2,.6+k*.5);if(x<-60||y<-30||x>W+60||y>H+30)return;if(!n.ic&&r>=3)ensureImg(n);if(n.ic)r=r*1.4+2.5;const pb=Math.min(1,(tm-n.b)/380);if(pb<=0)return;const ev=1-(1-pb)**3;r*=.3+.7*ev;const dim=nb&&!nb.has(i);g.globalAlpha=(dim?.15:1)*ev;

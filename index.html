<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Verbind — O mapa da internet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;600&family=DM+Mono:wght@400;500&display=swap">
  <style>
    :root {
      --bg: #fff;
      --fg: #000;
      --mut: #4d4d4d;
      --line: #d6d6d6;
      --soft: #f2f2f2;
      --btnbg: #000;
      --btnfg: #fff;
      color-scheme: light
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--soft);
      color: var(--fg);
      font: 400 15px/1.55 "Instrument Sans", Arial, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: "Bricolage Grotesque", Arial, sans-serif;
      margin: 0;
      letter-spacing: -.04em;
      line-height: 1
    }

    p {
      margin: 0
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none
    }

    :focus-visible {
      outline: 3px solid var(--fg);
      outline-offset: 3px
    }

    .mono,
    h4 {
      font: 500 11px/1.5 "DM Mono", monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--mut)
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 0;
      cursor: pointer;
      font: 700 14px "Bricolage Grotesque", sans-serif;
      letter-spacing: -.01em;
      padding: 11px 16px 11px 14px;
      border-radius: 9px;
      background: var(--btnbg);
      color: var(--btnfg);
      line-height: 1.1
    }

    .btn i {
      width: 8px;
      height: 14px;
      border-radius: 3px;
      background: currentColor;
      display: block
    }

    .btn:hover i,
    .btn:focus-visible i {
      animation: gest .9s cubic-bezier(.5, 0, .3, 1)
    }

    @keyframes gest {
      0% {
        transform: rotate(0)
      }

      45% {
        transform: rotate(-30deg)
      }

      55% {
        transform: rotate(-35deg)
      }

      62% {
        transform: rotate(-30deg)
      }

      100% {
        transform: rotate(0)
      }
    }

    .btn[aria-pressed=false] {
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--fg);
      padding: 10px 15px
    }

    .gh {
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--fg);
      padding: 10px 15px
    }

    input,
    select {
      font: 400 14px "Instrument Sans", sans-serif;
      background: #fff;
      color: #000;
      border: 1px solid #000;
      border-radius: 9px;
      padding: 10px 12px;
      outline: none
    }

    #q {
      width: 230px;
      max-width: 60vw
    }

    #ctl button {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 9px;
      cursor: pointer;
      color: #000
    }

    #ctl {
      position: fixed;
      right: 12px;
      bottom: 12px;
      display: flex;
      gap: 6px
    }

    #ctl button {
      width: 40px;
      height: 40px;
      font: 500 16px "DM Mono", monospace
    }

    #ctl button:hover {
      background: #000;
      color: #fff
    }

    #tip {
      position: fixed;
      display: none;
      pointer-events: none;
      background: #fff;
      border: 1px solid var(--line);
      padding: 8px 12px;
      font-size: 12px;
      white-space: nowrap
    }

    #tip small {
      display: block;
      color: var(--mut)
    }

    #panel {
      position: fixed;
      left: 14px;
      top: 14px;
      width: 360px;
      max-width: calc(100% - 78px);
      max-height: calc(100% - 80px);
      overflow: auto;
      display: none;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 22px
    }

    #panel.full {
      inset: 0;
      width: auto;
      max-width: none;
      max-height: none;
      border: 0;
      border-radius: 0;
      z-index: 30;
      padding: 28px clamp(18px, 5vw, 70px) 60px;
      background: #000;
      color: #fff;
      --fg: #fff;
      --bg: #000;
      --mut: #b3b3b3;
      --line: #333;
      --soft: #111;
      --btnbg: #fff;
      --btnfg: #000
    }

    .ph {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px
    }

    .kind {
      font: 500 11px "DM Mono", monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 5px 9px;
      color: var(--mut)
    }

    .pb button {
      width: 34px;
      height: 34px;
      margin-left: 6px;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--fg);
      cursor: pointer;
      font-size: 15px
    }

    .pb button:hover {
      background: var(--fg);
      color: var(--bg)
    }

    h2 {
      margin: 16px 0 8px;
      font-size: 28px;
      font-weight: 800
    }

    #panel.full h2 {
      font-size: clamp(40px, 6.5vw, 92px);
      line-height: .95
    }

    .m {
      font: 500 11px/1.6 "DM Mono", monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--mut)
    }

    h4 {
      margin: 22px 0 8px
    }

    #panel img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 42vh;
      object-fit: contain;
      border-radius: 4px;
      margin: 12px 0 0;
      background: var(--soft)
    }

    #panel.full img {
      max-height: 58vh
    }

    .sum {
      white-space: pre-line;
      color: var(--mut);
      line-height: 1.6;
      margin-top: 10px
    }

    #panel.full .sum {
      font-size: 17px
    }

    .lnk {
      color: var(--fg);
      font: 700 14px "Bricolage Grotesque", sans-serif;
      text-underline-offset: 4px;
      display: inline-block;
      margin-top: 8px
    }

    .b {
      margin: 16px 0
    }

    .ins {
      padding-left: 18px;
      margin: 0;
      color: var(--mut);
      line-height: 1.55
    }

    .ins li {
      margin-bottom: 7px
    }

    .n {
      display: flex;
      justify-content: space-between;
      padding: 9px 6px;
      border-bottom: 1px solid var(--line);
      cursor: pointer
    }

    .n:hover {
      background: var(--soft)
    }

    .bd {
      font-family: "DM Mono", monospace
    }

    .grid {
      display: block
    }

    #panel.full .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
      gap: 56px;
      margin-top: 12px
    }

    @media(max-width:800px) {
      #panel.full .grid {
        display: block
      }
    }

    .cn {
      border: 1px solid var(--line);
      padding: 16px 18px;
      margin-bottom: 12px;
      background: var(--soft)
    }

    .ct {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      font: 800 20px "Bricolage Grotesque", sans-serif;
      letter-spacing: -.03em
    }

    .ct:hover b {
      text-decoration: underline;
      text-underline-offset: 4px
    }

    .str {
      font: 500 11px "DM Mono", monospace;
      letter-spacing: .2em;
      color: var(--fg);
      white-space: nowrap;
      align-self: center
    }

    .rz {
      display: flex;
      gap: 10px;
      margin-top: 9px;
      color: var(--mut);
      font-size: 14px;
      line-height: 1.5
    }

    .ic {
      width: 20px;
      text-align: center;
      font-family: "DM Mono", monospace;
      color: var(--fg)
    }

    .rz b {
      color: var(--fg);
      font-weight: 600
    }

    #fl {
      position: fixed;
      right: 12px;
      top: 12px;
      z-index: 31;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .fb {
      position: relative;
      width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 50%;
      background: #fff;
      border: 1px solid var(--line);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      font: 700 13px "Bricolage Grotesque", sans-serif;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .08)
    }

    .fb svg {
      width: 20px;
      height: 20px;
      flex: none
    }

    .fb:hover,
    .fb.on {
      background: #000;
      color: #fff;
      border-color: #000
    }

    .fb b {
      position: absolute;
      top: -5px;
      right: -5px;
      min-width: 17px;
      height: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      font: 500 10px "DM Mono", monospace;
      background: #000;
      color: #fff;
      border: 1px solid #fff;
      border-radius: 9px;
      padding: 0 4px
    }

    .fb:hover b,
    .fb.on b {
      background: #fff;
      color: #000
    }

    .card {
      position: fixed;
      right: 66px;
      top: 12px;
      width: 360px;
      max-width: calc(100% - 78px);
      max-height: calc(100% - 24px);
      overflow: auto;
      display: none;
      z-index: 30;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 20px
    }

    .card.on {
      display: block
    }

    .card h3 {
      font: 800 22px "Bricolage Grotesque", sans-serif;
      letter-spacing: -.04em;
      margin: 0 0 4px
    }

    .card h4 {
      margin: 18px 0 8px
    }

    .card label.f {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      cursor: pointer
    }

    .card input[type=checkbox] {
      accent-color: #000;
      width: 16px;
      height: 16px;
      padding: 0;
      border: 0
    }

    .card input[type=range] {
      width: 100%;
      accent-color: #000;
      padding: 0;
      border: 0
    }

    .card input[type=text],
    .card select {
      width: 100%
    }

    .card #q {
      width: 100%;
      max-width: none
    }

    .fr {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line)
    }

    .fr:last-child {
      border: 0
    }

    .fn {
      flex: 1;
      font-weight: 600
    }

    .fr small {
      font: 500 10px "DM Mono", monospace;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--mut);
      max-width: 105px;
      text-align: right
    }

    .fr .hl {
      padding: 4px 9px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      font: 500 10px "DM Mono", monospace;
      text-transform: uppercase;
      letter-spacing: .08em;
      cursor: pointer;
      color: #000
    }

    .fr .hl.on {
      background: #000;
      color: #fff
    }

    .row2 {
      display: flex;
      gap: 8px
    }

    .row2>* {
      flex: 1;
      min-width: 0
    }

    #st {
      position: fixed;
      left: 64px;
      bottom: 32px;
      z-index: 20;
      max-width: calc(100% - 210px);
      font: 500 11px "DM Mono", monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--fg);
      background: #ffffffe0;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 7px 12px;
      opacity: 0;
      transition: opacity .4s;
      pointer-events: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    #st.on {
      opacity: 1
    }

    #pb {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      z-index: 40;
      pointer-events: none;
      opacity: 0;
      transition: opacity .3s
    }

    #pb.on {
      opacity: 1
    }

    #pb i {
      display: block;
      height: 100%;
      width: 0;
      background: #000;
      transition: width .3s
    }

    body.pf #ctl,
    body.pf #bmenu,
    body.pf #side {
      display: none
    }

    @media(max-width:700px) {
      .card {
        width: auto;
        left: 12px;
        right: 66px
      }
    }

    #bmenu {
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 31
    }

    body.sd #bmenu {
      display: none
    }

    #side {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: min(350px, calc(100% - 44px));
      z-index: 32;
      background: var(--bg);
      color: var(--fg);
      border-right: 1px solid var(--line);
      box-shadow: 6px 0 28px rgba(0, 0, 0, .12);
      display: flex;
      flex-direction: column;
      transform: translateX(-104%);
      visibility: hidden;
      transition: transform .32s cubic-bezier(.5, 0, .2, 1), visibility 0s .32s
    }

    #side.on {
      transform: none;
      visibility: visible;
      transition: transform .32s cubic-bezier(.5, 0, .2, 1), visibility 0s
    }

    .sh {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px 12px
    }

    .sh h3 {
      font-size: 24px;
      font-weight: 800
    }

    #sx {
      width: 34px;
      height: 34px;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--fg);
      cursor: pointer;
      font-size: 15px
    }

    #sx:hover {
      background: var(--fg);
      color: var(--bg)
    }

    .tabs {
      display: flex;
      gap: 6px;
      padding: 0 18px 14px;
      border-bottom: 1px solid var(--line)
    }

    .tb {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 38px;
      padding: 0 6px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: transparent;
      color: var(--fg);
      cursor: pointer;
      font: 700 13px "Bricolage Grotesque", sans-serif
    }

    .tb svg {
      width: 16px;
      height: 16px;
      flex: none
    }

    .tb:hover,
    .tb.on {
      background: var(--fg);
      color: var(--bg);
      border-color: var(--fg)
    }

    .tb b {
      font: 500 10px "DM Mono", monospace;
      border: 1px solid currentColor;
      border-radius: 8px;
      padding: 0 5px;
      line-height: 15px
    }

    #sbody {
      flex: 1;
      overflow: auto;
      padding: 0 18px 28px
    }

    #side .card {
      position: static;
      display: none;
      width: auto;
      max-width: none;
      max-height: none;
      overflow: visible;
      border: 0;
      border-radius: 0;
      padding: 16px 0 0;
      background: transparent;
      color: inherit
    }

    #side .card.on {
      display: block
    }

    body.sd #st {
      left: calc(min(350px, 100vw - 44px) + 14px)
    }

    @media(min-width:701px) {
      body.sd #panel:not(.full) {
        left: calc(350px + 14px)
      }
    }

    .dk #side {
      background: #171717
    }

    .dk .tb:hover,
    .dk .tb.on {
      background: #f2f2f2;
      color: #000;
      border-color: #f2f2f2
    }

    .tg {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      cursor: pointer
    }

    .card .tg input[type=checkbox] {
      appearance: none;
      -webkit-appearance: none;
      width: 40px;
      height: 22px;
      border-radius: 11px;
      background: var(--line);
      position: relative;
      cursor: pointer;
      border: 0;
      padding: 0;
      margin: 0;
      flex: none;
      transition: background .2s
    }

    .card .tg input[type=checkbox]::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--bg);
      transition: transform .2s
    }

    .card .tg input[type=checkbox]:checked {
      background: var(--fg)
    }

    .card .tg input[type=checkbox]:checked::after {
      transform: translateX(18px)
    }

    body.nolog #st {
      display: none !important
    }

    .dk {
      --bg: #0f0f0f;
      --fg: #f2f2f2;
      --mut: #a3a3a3;
      --line: #2e2e2e;
      --soft: #0f0f0f;
      --btnbg: #f2f2f2;
      --btnfg: #000;
      color-scheme: dark
    }

    .dk input,
    .dk select {
      background: #1b1b1b;
      color: #f2f2f2;
      border-color: #bdbdbd
    }

    .dk #ctl button,
    .dk .fb,
    .dk .card,
    .dk #panel,
    .dk #tip,
    .dk .fr .hl {
      background: #171717;
      color: #f2f2f2
    }

    .dk #ctl button:hover,
    .dk .fb:hover,
    .dk .fb.on,
    .dk .fr .hl.on {
      background: #f2f2f2;
      color: #000;
      border-color: #f2f2f2
    }

    .dk .fb b {
      background: #f2f2f2;
      color: #000;
      border-color: #171717
    }

    .dk .fb:hover b,
    .dk .fb.on b {
      background: #000;
      color: #fff
    }

    .dk .card input[type=range] {
      accent-color: #f2f2f2
    }

    .dk .card input[type=checkbox] {
      accent-color: #f2f2f2
    }

    .dk #st {
      background: #171717e6
    }

    .dk #pb i {
      background: #f2f2f2
    }

    .dk #panel.full {
      background: #000
    }

    .dk .btn.gh {
      border-color: #f2f2f2
    }
  </style>
</head>

<body>
  <canvas id="c"></canvas>
  <div id="pb"><i id="pbi"></i></div>
  <aside id="side" aria-label="Menu">
    <div class="sh">
      <h3>Menu</h3><button id="sx" aria-label="Fechar menu">✕</button>
    </div>
    <div class="tabs" role="tablist"><button id="tsb" class="tb on" role="tab"><svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="M15.5 15.5L21 21" />
        </svg>Buscar</button><button id="tfb" class="tb" role="tab"><svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3l9 5-9 5-9-5 9-5z" />
          <path d="M3 13l9 5 9-5" />
        </svg>Filtros<b id="fc">0</b></button><button id="tse" class="tb" role="tab"><svg viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" />
        </svg>Ajustes</button></div>
    <div id="sbody">
      <div id="sbox" class="card on">
        <h3>Buscar</h3>
        <div class="m" style="margin:2px 0 12px">Um tema, mapeado em todas as fontes</div><input id="q" type="text"
          placeholder="Um tema, se quiser">
        <div class="row2" style="margin-top:8px"><select id="lang">
            <option value="pt">Português</option>
            <option value="en">English</option>
            <option value="es">Español</option>
          </select><button id="go" class="btn sm"><i></i>Mapear</button></div><button id="hm" class="btn sm gh"
          style="margin-top:8px;width:100%;justify-content:center">↺ Voltar ao que está em alta</button>
      </div>
      <div id="fm" class="card">
        <h3>Fontes e filtros</h3>
        <div id="fsum" class="m"></div>
        <h4>Fontes</h4>
        <div id="fsrc"></div>
        <h4>Relevância mínima · <span id="relv">0%</span></h4><input type="range" id="frel" min="0" max="100" value="0">
        <h4>Texto no título</h4><input type="text" id="ftxt" placeholder="filtrar por palavra…">
        <h4>Geral</h4><label class="f"><input type="checkbox" id="fimg"> só itens com imagem</label><label
          class="f"><input type="checkbox" id="fcon"> só itens com conexões</label>
        <h4>Wikipedia</h4><label class="f"><input type="checkbox" id="fhot"> só os que estão em alta (anel)</label>
        <h4>YouTube</h4>
        <div class="row2"><select id="fcat"></select><select id="freg"></select></div>
        <h4>Internet Archive</h4><select id="fty"></select>
        <button id="fclr" class="btn sm gh" style="margin-top:16px">Limpar filtros</button>
      </div>
